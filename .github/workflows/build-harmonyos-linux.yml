name: 构建 HarmonyOS HAP Linux

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      版本号处理:
        description: "打包前如何处理版本号"
        required: true
        default: "增量版本"
        type: choice
        options:
          - "增量版本"
          - "完整版本"
          - "不改版本"
      只检查环境:
        description: "true 表示只做环境检查，不真正构建 HAP"
        required: true
        default: false
        type: boolean
      跳过包验证:
        description: "true 表示跳过 HAP 包验证；false 表示执行验证"
        required: true
        default: true
        type: boolean

jobs:
  build:
    name: 构建 HAP Linux (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      matrix:
        abi: [arm64-v8a, x86_64]

    env:
      CI: "true"
      ARTIFACT_TYPE: "hap"
      VERSION_BUMP: ${{ inputs['版本号处理'] == '完整版本' && 'full' || inputs['版本号处理'] == '不改版本' && 'none' || 'incremental' }}
      PREFLIGHT_ONLY: ${{ inputs['只检查环境'] || false }}
      SKIP_PACKAGE_VERIFY: ${{ inputs['跳过包验证'] || true }}
      SDK_REPO: liyan-lucky/HarmonyOS_SDK_Tools
      SDK_TAG: linux_command_line_tool_6.1.1
      SDK_ASSET: linux-harmonyos-command-line-tool-full.7z

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v7

      - name: 设置 Java 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - name: 设置 Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: 安装系统工具
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip p7zip-full curl jq python3 rsync

      - name: 校验 SDK Token 输入
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HARMONYOS_SDK_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "缺少 HARMONYOS_SDK_TOKEN。请在仓库 Secrets 中配置可读取私有 SDK 仓库的 Token。"
            exit 1
          fi

      - name: 安装完整 HarmonyOS SDK
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HARMONYOS_SDK_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          SDK_BASE="/home/runner/harmonyos-sdk"
          SDK_ARCHIVE="$RUNNER_TEMP/$SDK_ASSET"
          SDK_EXTRACT="$RUNNER_TEMP/authorized-sdk"

          rm -rf "$SDK_EXTRACT" "$SDK_BASE"
          mkdir -p "$SDK_EXTRACT" "$SDK_BASE"

          echo "从私有 SDK 仓库下载完整 HarmonyOS SDK：$SDK_REPO / $SDK_TAG / $SDK_ASSET"
          gh release download "$SDK_TAG" \
            --repo "$SDK_REPO" \
            --pattern "$SDK_ASSET" \
            --dir "$RUNNER_TEMP"

          if [ ! -f "$SDK_ARCHIVE" ]; then
            echo "SDK 资产未下载成功：$SDK_ARCHIVE"
            ls -la "$RUNNER_TEMP"
            exit 1
          fi

          echo "解压完整 HarmonyOS SDK..."
          case "$SDK_ASSET" in
            *.zip)
              unzip -oq "$SDK_ARCHIVE" -d "$SDK_EXTRACT"
              ;;
            *.7z)
              7z x -y "$SDK_ARCHIVE" -o"$SDK_EXTRACT"
              ;;
            *)
              echo "不支持的 SDK 压缩包格式：$SDK_ASSET"
              exit 1
              ;;
          esac

          echo "解压后的顶层目录结构:"
          ls -la "$SDK_EXTRACT"

          SDK_ROOT=""
          for candidate in \
            "$SDK_EXTRACT" \
            "$SDK_EXTRACT"/* \
            "$SDK_EXTRACT"/*/extract \
            "$SDK_EXTRACT"/extract
          do
            if [ -d "$candidate/sdk" ] && { [ -d "$candidate/bin" ] || [ -d "$candidate/hvigor" ] || [ -d "$candidate/ohpm" ]; }; then
              SDK_ROOT="$candidate"
              break
            fi
          done

          if [ -z "$SDK_ROOT" ]; then
            SDK_SOURCE=$(find "$SDK_EXTRACT" -maxdepth 4 -type f -name sdk-pkg.json -print -quit | xargs -r dirname || true)
            if [ -n "$SDK_SOURCE" ]; then
              for d in "$SDK_SOURCE" "$SDK_SOURCE/.." "$SDK_SOURCE/../.." "$SDK_SOURCE/../../.."; do
                if [ -d "$d/sdk" ] && { [ -d "$d/bin" ] || [ -d "$d/hvigor" ] || [ -d "$d/ohpm" ]; }; then
                  SDK_ROOT="$d"
                  break
                fi
              done
            fi
          fi

          if [ -z "$SDK_ROOT" ]; then
            echo "未能在压缩包中定位 SDK 根目录。"
            find "$SDK_EXTRACT" -maxdepth 3 -type d | sort | head -50
            exit 1
          fi

          echo "找到 SDK_ROOT: $SDK_ROOT"
          ls -la "$SDK_ROOT"

          echo "将 SDK 内容移动到 SDK_BASE..."
          shopt -s dotglob nullglob
          for item in "$SDK_ROOT"/*; do
            name=$(basename "$item")
            rm -rf "$SDK_BASE/$name"
            mv "$item" "$SDK_BASE/$name"
          done

          if [ ! -e "$SDK_BASE/HarmonyOS-6.1.1" ] && [ -d "$SDK_BASE/hms" ]; then
            ln -s hms "$SDK_BASE/HarmonyOS-6.1.1"
          fi

          rm -f "$SDK_ARCHIVE"
          rm -rf "$SDK_EXTRACT"
          chmod +x "$SDK_BASE/openharmony/toolchains"/* 2>/dev/null || true
          chmod +x "$SDK_BASE/hms/toolchains"/* 2>/dev/null || true
          chmod +x "$SDK_BASE/openharmony/native/build-tools/cmake/bin"/* 2>/dev/null || true
          chmod +x "$SDK_BASE/openharmony/native/llvm/bin"/* 2>/dev/null || true
          chmod +x "$SDK_BASE/openharmony/previewer/common/bin"/* 2>/dev/null || true
          chmod +x "$SDK_BASE/hms/native/build-tools/cmake/bin"/* 2>/dev/null || true
          chmod +x "$SDK_BASE/hms/native/llvm/bin"/* 2>/dev/null || true
          chmod +x "$SDK_BASE/bin"/* 2>/dev/null || true
          chmod +x "$SDK_BASE/ohpm/bin"/* 2>/dev/null || true
          chmod +x "$SDK_BASE/hvigor/bin"/* 2>/dev/null || true
          chmod +x "$SDK_BASE/tool/node/bin"/* 2>/dev/null || true

          echo "SDK_BASE 目录结构:"
          ls -la "$SDK_BASE"

          test -f "$SDK_BASE/sdk/default/sdk-pkg.json"
          test -d "$SDK_BASE/sdk/default/openharmony/native"
          test -d "$SDK_BASE/bin"

      - name: 定位 HarmonyOS SDK
        shell: bash
        run: |
          SDK_BASE="/home/runner/harmonyos-sdk"
          SDK_HOME="$SDK_BASE/sdk/default"
          echo "DEVECO_SDK_HOME=$SDK_HOME" >> "$GITHUB_ENV"
          echo "OHOS_HVIGOR_SDK_ROOT=$SDK_HOME" >> "$GITHUB_ENV"
          echo "DEVECO_TOOLS_HOME=$SDK_BASE" >> "$GITHUB_ENV"
          echo "DEVECO_NODE_EXE=$(command -v node)" >> "$GITHUB_ENV"
          echo "PATH=$SDK_BASE/bin:$SDK_BASE/ohpm/bin:$SDK_BASE/hvigor/bin:$SDK_BASE/tool/node/bin:$SDK_HOME/openharmony/native/llvm/bin:$PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$SDK_HOME/hms/toolchains/lib:$SDK_HOME/openharmony/previewer/common/bin:$SDK_HOME/openharmony/ets/build-tools/ets-loader/bin/ark/build/bin:$SDK_HOME/openharmony/toolchains:$SDK_HOME/openharmony/toolchains/lib:$SDK_HOME/hms/native/sysroot/usr/lib/x86_64-linux-ohos:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          node -v

      - name: 输出调试环境
        shell: bash
        run: |
          echo "DEVECO_SDK_HOME=$DEVECO_SDK_HOME"
          echo "OHOS_HVIGOR_SDK_ROOT=$OHOS_HVIGOR_SDK_ROOT"
          echo "DEVECO_TOOLS_HOME=$DEVECO_TOOLS_HOME"
          echo "DEVECO_NODE_EXE=$DEVECO_NODE_EXE"
          echo "RUSTDESK_SIGNING_ZIP_B64 是否为空？ $([ -z "$RUSTDESK_SIGNING_ZIP_B64" ] && echo 是 || echo 否)"

      - name: 构建 HarmonyOS 包
        shell: bash
        env:
          HARMONY_ARTIFACTS_DIR: ${{ runner.temp }}/rustdesk_harmonyos_artifacts
        run: |
          chmod +x scripts/github_build_harmonyos_linux.sh
          args=(
            "--artifact-type" "$ARTIFACT_TYPE"
            "--version-bump" "$VERSION_BUMP"
            "--artifacts-dir" "$HARMONY_ARTIFACTS_DIR"
            "--abi-filter" "${{ matrix.abi }}"
          )
          if [ "$PREFLIGHT_ONLY" = "true" ]; then
            args+=("--preflight-only")
          fi
          if [ "$SKIP_PACKAGE_VERIFY" = "true" ]; then
            args+=("--skip-package-verify")
          fi
          scripts/github_build_harmonyos_linux.sh "${args[@]}"

      - name: 上传 HarmonyOS 构建产物
        if: ${{ inputs['只检查环境'] != true }}
        uses: actions/upload-artifact@v7
        with:
          name: harmonyos-hap-${{ matrix.abi }}
          path: ${{ runner.temp }}/rustdesk_harmonyos_artifacts/*.hap
          if-no-files-found: error
